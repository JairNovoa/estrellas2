<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Beibi 💫</title>
<style>
  :root{
    --txt-glow: 0 0 10px rgba(0,0,0,.9), 0 0 20px rgba(0,0,0,.7), 0 2px 4px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
    font-family: 'Georgia', 'Segoe UI', serif;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: clamp(1rem, 3vh, 2.2rem);
    padding: 4vh 5%;
    opacity:0;
    z-index:1;
    transition: opacity 1.4s ease;
  }
  .scene.active{ opacity:1; z-index:2; }
  .bg-blur{
    position:absolute; inset:-5%;
    background-size:cover;
    background-position:center;
    filter: blur(45px) brightness(0.55) saturate(1.1);
    transform: scale(1.15);
    z-index:0;
  }
  .fg-img{
    position:relative;
    z-index:1;
    max-width:92vw;
    max-height:62vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:14px;
    box-shadow:0 18px 55px rgba(0,0,0,.55);
    display:block;
  }
  @media (min-width:900px){
    .fg-img{ max-height:68vh; max-width:70vw; }
  }
  @media (orientation:landscape) and (max-height:500px){
    .fg-img{ max-height:52vh; }
  }
  .caption{
    position:relative;
    z-index:5;
    color:#fff8dc;
    text-shadow: var(--txt-glow);
    font-size:clamp(1.3rem, 4.5vw, 3rem);
    text-align:center;
    width:100%;
    padding:0 8%;
    max-width: 900px;
    margin: 0 auto;
    letter-spacing:0.5px;
    animation: fadeInText 1.8s ease;
  }
  @media (min-width:600px) and (max-width:1024px){
    .caption{ font-size:clamp(1.8rem, 4vw, 3.2rem); padding:0 12%; }
  }
  @media (min-width:1025px){
    .caption{ font-size:clamp(2rem, 3vw, 3.6rem); padding:0 16%; }
  }
  @media (orientation:landscape) and (max-height:500px){
    .caption{ font-size:clamp(1.1rem, 4vw, 2rem); }
  }
  .scene > .caption{
    position:absolute;
    left:0; right:0;
    bottom: clamp(1.5rem, 6vh, 4rem);
  }
  @keyframes fadeInText{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }
  #scene-final{
    background: radial-gradient(circle at center, #1a1240 0%, #05030f 100%);
  }
  #scene-final .caption{
    color:#ffe6f0;
  }
  #restart-btn{
    margin-top:2rem;
    padding:0.9rem 2.2rem;
    font-size:1.1rem;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#ff6fa5,#ffd36e);
    color:#2b0a1f;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 18px rgba(255,111,165,.6);
    opacity:0;
    animation: fadeInBtn 1.5s ease 0.8s forwards;
    transition: transform .2s ease;
  }
  #restart-btn:hover{ transform:scale(1.06); }
  @keyframes fadeInBtn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  #final-inner{
    display:flex; flex-direction:column; align-items:center;
  }
  #sparkle-overlay, #bubble-overlay, #heart-overlay{
    position:absolute; inset:0;
    z-index:10;
    pointer-events:none;
    opacity:0;
  }
  .sparkle{
    position:absolute;
    border-radius:50%;
    filter: blur(0.3px);
    box-shadow:0 0 12px 4px currentColor;
  }
  @keyframes sparklePop{
    0%{ transform:scale(0); opacity:0; }
    35%{ opacity:1; }
    100%{ transform:scale(1); opacity:0; }
  }
  .bubble{
    position:absolute;
    bottom:-10%;
    border-radius:50%;
    opacity:0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), currentColor 70%);
  }
  @keyframes bubbleRise{
    0%{ transform:translateY(0) scale(0.3); opacity:0; }
    15%{ opacity:.9; }
    100%{ transform:translateY(-115vh) scale(1.15); opacity:0; }
  }
  .heart{
    position:absolute;
    bottom:-8%;
    color:#ff2d55;
    opacity:0;
    filter: drop-shadow(0 0 6px rgba(255,45,85,.7));
  }
  @keyframes heartRise{
    0%{ transform:translateY(0) scale(0.4) rotate(-8deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translateY(-120vh) scale(1.2) rotate(8deg); opacity:0; }
  }
  #start-overlay{
    position:fixed; inset:0; z-index:50;
    background: radial-gradient(circle at center, #1a1240 0%, #05030f 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.6rem;
    text-align:center;
    padding:0 8%;
  }
  #start-overlay p{
    color:#fff8dc;
    font-size:clamp(1.1rem, 4.5vw, 1.7rem);
    text-shadow: var(--txt-glow);
  }
  #start-btn{
    padding:0.9rem 2.2rem;
    font-size:1.1rem;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#ff6fa5,#ffd36e);
    color:#2b0a1f;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 18px rgba(255,111,165,.6);
    transition: transform .2s ease;
  }
  #start-btn:hover{ transform:scale(1.06); }
  #pause-btn{
    position:fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    z-index:40;
    width:48px; height:48px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    font-size:1.3rem;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(4px);
  }
  #pause-btn.hidden{ display:none; }
</style>
</head>
<body>

<div id="stage">

  <section class="scene active" id="scene-cielo">
    <div class="bg-blur" style="background-image:url('cielo.png')"></div>
    <img class="fg-img" src="cielo.png" alt="Cielo estrellado">
    <p class="caption">Existen estrellas en el cielo...</p>
  </section>

  <section class="scene" id="scene-mar">
    <div class="bg-blur" style="background-image:url('mar.png')"></div>
    <img class="fg-img" src="mar.png" alt="Estrella de mar">
    <p class="caption">...en el mar...</p>
  </section>

  <section class="scene" id="scene-beibi">
    <div class="bg-blur" style="background-image:url('beibi.jpg')"></div>
    <img class="fg-img" src="beibi.jpg" alt="Beibi">
    <p class="caption">...y en la Tierra 😍</p>
  </section>

  <section class="scene" id="scene-final">
    <div id="final-inner">
      <p class="caption">¡Te extraño mucho! <br><br>😘<br></p>
      <button id="restart-btn">Volver a empezar</button>
    </div>
  </section>

  <div id="sparkle-overlay"></div>
  <div id="bubble-overlay"></div>
  <div id="heart-overlay"></div>
</div>

<audio id="bg-audio" src="jamas.mp3" preload="auto"></audio>

<div id="start-overlay">
  <p>For you, my love 💌</p>
  <button id="start-btn">▶ Toca para comenzar</button>
</div>

<button id="pause-btn" class="hidden" aria-label="Pausar">⏸</button>

<script>
const SCENE_DURATION = 13000; // 13s por escena
const scenes = ['scene-cielo','scene-mar','scene-beibi','scene-final'];
const sceneEls = scenes.map(id=>document.getElementById(id));
const sparkleOverlay = document.getElementById('sparkle-overlay');
const bubbleOverlay = document.getElementById('bubble-overlay');
const heartOverlay = document.getElementById('heart-overlay');
const audio = document.getElementById('bg-audio');
const restartBtn = document.getElementById('restart-btn');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');

function colorPalette(){
  return ['#ffd36e','#ff6fa5','#6ec6ff','#9dff8f','#ffffff','#ffb84d'];
}

function launchSparkles(){
  sparkleOverlay.innerHTML = '';
  sparkleOverlay.style.opacity = '1';
  const colors = colorPalette();
  const count = 55;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = 6 + Math.random()*22;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.color = colors[Math.floor(Math.random()*colors.length)];
    s.style.background = 'currentColor';
    const dur = 0.8 + Math.random()*0.9;
    const delay = Math.random()*0.6;
    s.style.animation = `sparklePop ${dur}s ease ${delay}s`;
    sparkleOverlay.appendChild(s);
  }
  setTimeout(()=>{ sparkleOverlay.style.opacity='0'; sparkleOverlay.innerHTML=''; }, 1900);
}

function launchBubbles(){
  bubbleOverlay.innerHTML = '';
  bubbleOverlay.style.opacity = '1';
  const colors = colorPalette();
  const count = 40;
  for(let i=0;i<count;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 18 + Math.random()*70;
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.left = (Math.random()*100)+'%';
    b.style.color = colors[Math.floor(Math.random()*colors.length)];
    const dur = 1.4 + Math.random()*1.0;
    const delay = Math.random()*0.5;
    b.style.animation = `bubbleRise ${dur}s ease-in ${delay}s`;
    bubbleOverlay.appendChild(b);
  }
  setTimeout(()=>{ bubbleOverlay.style.opacity='0'; bubbleOverlay.innerHTML=''; }, 2100);
}

function launchHearts(){
  heartOverlay.innerHTML = '';
  heartOverlay.style.opacity = '1';
  const count = 36;
  for(let i=0;i<count;i++){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '❤';
    const size = 14 + Math.random()*28;
    h.style.fontSize = size+'px';
    h.style.left = (Math.random()*100)+'%';
    const dur = 1.5 + Math.random()*1.1;
    const delay = Math.random()*0.5;
    h.style.animation = `heartRise ${dur}s ease-in ${delay}s`;
    heartOverlay.appendChild(h);
  }
  setTimeout(()=>{ heartOverlay.style.opacity='0'; heartOverlay.innerHTML=''; }, 2200);
}

function showScene(index){
  sceneEls.forEach((el,i)=> el.classList.toggle('active', i===index));
}

let fadeInterval = null;

function clearFade(){
  if(fadeInterval){ clearInterval(fadeInterval); fadeInterval = null; }
}

function fadeOutAudio(durationMs){
  clearFade();
  const steps = 20;
  const stepTime = durationMs/steps;
  const startVol = audio.volume;
  let i = 0;
  fadeInterval = setInterval(()=>{
    i++;
    audio.volume = Math.max(0, startVol * (1 - i/steps));
    if(i>=steps){
      clearFade();
      audio.pause();
      audio.volume = 1;
    }
  }, stepTime);
}

// --- Motor de reproducción pausable, basado en tiempo transcurrido ---
const TOTAL_DURATION = SCENE_DURATION*3;
const events = [
  { t: SCENE_DURATION - 1200, fired:false, action: launchSparkles },
  { t: SCENE_DURATION,        fired:false, action: ()=>showScene(1) },
  { t: SCENE_DURATION*2 - 1200, fired:false, action: launchBubbles },
  { t: SCENE_DURATION*2,      fired:false, action: ()=>showScene(2) },
  { t: SCENE_DURATION*3 - 1200, fired:false, action: ()=>{ launchHearts(); fadeOutAudio(1200); } },
  { t: SCENE_DURATION*3,      fired:false, action: ()=>{ showScene(3); stopClock(); setPauseVisible(false); } },
];

let elapsed = 0;
let running = false;
let paused = false;
let lastTick = 0;
let clockHandle = null;

function resetEvents(){
  events.forEach(e=> e.fired = false);
}

function setPauseVisible(visible){
  pauseBtn.classList.toggle('hidden', !visible);
}

function tick(){
  if(!running || paused) return;
  const now = performance.now();
  elapsed += now - lastTick;
  lastTick = now;
  events.forEach(e=>{
    if(!e.fired && elapsed >= e.t){
      e.fired = true;
      e.action();
    }
  });
  if(elapsed < TOTAL_DURATION){
    clockHandle = requestAnimationFrame(tick);
  }
}

function startClock(){
  running = true;
  paused = false;
  lastTick = performance.now();
  clockHandle = requestAnimationFrame(tick);
}

function stopClock(){
  running = false;
  if(clockHandle) cancelAnimationFrame(clockHandle);
}

function pauseSequence(){
  if(!running || paused) return;
  paused = true;
  if(clockHandle) cancelAnimationFrame(clockHandle);
  audio.pause();
  clearFade();
  pauseBtn.textContent = '▶';
  pauseBtn.setAttribute('aria-label','Reanudar');
}

function resumeSequence(){
  if(!running || !paused) return;
  paused = false;
  lastTick = performance.now();
  audio.play().catch(()=>{});
  clockHandle = requestAnimationFrame(tick);
  pauseBtn.textContent = '⏸';
  pauseBtn.setAttribute('aria-label','Pausar');
}

function togglePause(){
  if(paused) resumeSequence();
  else pauseSequence();
}

function startPresentation(){
  clearFade();
  stopClock();
  resetEvents();
  elapsed = 0;
  showScene(0);
  audio.pause();
  audio.currentTime = 0;
  audio.volume = 1;
  audio.play().catch(()=>{ /* requiere interacción del usuario */ });
  pauseBtn.textContent = '⏸';
  pauseBtn.setAttribute('aria-label','Pausar');
  setPauseVisible(true);
  startClock();
}

startBtn.addEventListener('click', ()=>{
  startOverlay.style.display = 'none';
  startPresentation();
});

restartBtn.addEventListener('click', ()=>{
  startPresentation();
});

pauseBtn.addEventListener('click', togglePause);
</script>

</body>
</html>
